name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly: tells you early if something rotted

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build the all-in-one image
        run: docker build -t moodqueue .
      - name: Smoke test
        run: |
          docker run -d --name mq -p 8000:8000 moodqueue
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q '<div id="root">'
          TOKEN=$(curl -fs -X POST localhost:8000/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.com","username":"ci_user","password":"password123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fs -X POST localhost:8000/api/mood/analyze -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"text":"Je suis nostalgique ce soir"}' | grep -q '"tracks"'
          docker logs mq
