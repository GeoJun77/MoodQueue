# Start everything:   docker compose up -d   ->  http://localhost:8000
#
# Works with no configuration at all (SQLite + offline mood engine +
# built-in music catalog). To enable Groq / Spotify / emails, copy
# .env.example to .env and fill in what you want.
services:
  moodqueue:
    build: .
    image: moodqueue:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - moodqueue-data:/app/data   # database + secret key survive restarts
    restart: unless-stopped

  # Optional PostgreSQL instead of SQLite:
  #   docker compose --profile postgres up -d
  # and set in .env:
  #   DATABASE_URL=postgresql://moodqueue:moodqueue@db:5432/moodqueue
  db:
    profiles: ["postgres"]
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: moodqueue
      POSTGRES_PASSWORD: moodqueue
      POSTGRES_DB: moodqueue
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodqueue"]
      interval: 5s
      retries: 10

volumes:
  moodqueue-data:
  postgres-data:
